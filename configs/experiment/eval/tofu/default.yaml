# @package _global_

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /eval: tofu

forget_split: forget10
holdout_split: holdout10
retain_split: retain10
forget_perturb_split: forget10_perturbed
retain_perturb_split: retain_perturbed
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_split: ${retain_split}
    forget_perturb_split: ${forget_perturb_split}
    retain_perturb_split: ${retain_perturb_split}
    retain_logs_path: ${retain_logs_path}

task_name: ???